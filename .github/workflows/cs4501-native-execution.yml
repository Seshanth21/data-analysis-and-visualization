name: Execute CS4501 Flex Bison laboratory

on:
  push:
    branches:
      - cs4501-compiler-design-lab
    paths:
      - "CS4501_BOOTSTRAP/RUN_NATIVE"

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cs4501-compiler-design-lab
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct project
        run: |
          set -euo pipefail
          cat CS4501_BOOTSTRAP/archive.b64.part* | base64 --decode > /tmp/cs4501.tar.gz
          echo "f0a7defbc921e5d9c1ac653083950f8a2522c38820d389bea1d5d52cff7043b2  /tmp/cs4501.tar.gz" | sha256sum -c -
          rm -rf CS4501_Compiler_Design_Lab
          tar -xzf /tmp/cs4501.tar.gz
      - name: Install Flex Bison GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison gcc python3
      - name: Build execute verify
        id: lab
        shell: bash
        run: |
          set +e
          mkdir -p CS4501_Compiler_Design_Lab/reports
          (cd CS4501_Compiler_Design_Lab && bash scripts/run_all.sh) 2>&1 | tee CS4501_Compiler_Design_Lab/reports/workflow_console.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$status" > CS4501_Compiler_Design_Lab/reports/workflow_exit_status.txt
          exit 0
      - name: Record provenance
        run: |
          cat > CS4501_Compiler_Design_Lab/reports/github_actions_run.md <<EOF
          # GitHub Actions native execution

          - Run ID: ${GITHUB_RUN_ID}
          - Run number: ${GITHUB_RUN_NUMBER}
          - Source commit: ${GITHUB_SHA}
          - Runner: ${RUNNER_OS}
          - Exit status: ${{ steps.lab.outputs.status }}
          EOF
      - name: Commit programs and outputs
        run: |
          set -euo pipefail
          rm -rf CS4501_BOOTSTRAP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Execute all CS4501 Flex Bison experiments" || true
          git push origin HEAD:cs4501-compiler-design-lab
      - name: Enforce success
        if: steps.lab.outputs.status != '0'
        run: exit 1
